      <button class="vid" data-vimeo="{{VIMEO_ID}}"{{HASH_ATTR}} aria-label="Play {{TITLE}} video">
        <div class="vid-thumb">
          <img src="{{THUMB}}" alt="Still from the {{TITLE}} video" loading="lazy">
          <span class="play" aria-hidden="true"></span>
        </div>
        <div class="vid-meta"><h3 data-i18n="{{TITLE_KEY}}">{{TITLE}}</h3></div>
      </button>
